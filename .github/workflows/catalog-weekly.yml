name: Catalog weekly sync

# Full catalog refresh once a week:
#  - db:import         → re-pull the CC0 anime-offline-database (adds new/upcoming
#                        titles, refreshes facts; never touches community descriptions)
#  - db:import-anime-rankings → refresh anime score/popularity from Jikan top/anime
#  - db:import-manga   → refresh the manga catalog from Jikan top/manga
#
# Requires a repository secret DATABASE_URL (Supabase session-pooler connection
# string). Trigger manually any time from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch:

# don't let two syncs overlap
concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Preflight — verify DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is empty/missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          host=$(node -e "try{process.stdout.write(new URL(process.env.DATABASE_URL).hostname)}catch{process.stdout.write('unparseable')}")
          echo "DB host: $host"
          case "$host" in
            *pooler.supabase.com) echo "OK: Supabase pooler host (IPv4-friendly).";;
            db.*.supabase.co) echo "::error::DATABASE_URL uses the DIRECT host ($host), which is IPv6-only and unreachable from GitHub's IPv4 runners. Use the Supabase Session pooler string (aws-0-<region>.pooler.supabase.com:5432)."; exit 1;;
            unparseable) echo "::error::DATABASE_URL is not a valid URL — likely an unencoded special char in the password (e.g. # → %23)."; exit 1;;
            *) echo "::warning::Unrecognized DB host '$host' — ensure it is reachable from GitHub Actions and the Supabase project is not paused.";;
          esac
      - name: Full anime catalog (offline DB)
        run: npm run db:import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Anime rankings (Jikan top/anime)
        run: npm run db:import-anime-rankings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Manga catalog (Jikan top/manga)
        run: npm run db:import-manga
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Backfill English titles (AniList — fills missing only)
        run: npm run db:backfill-english
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
