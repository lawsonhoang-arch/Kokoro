name: Catalog weekly sync

# Full catalog refresh once a week:
#  - db:import         → re-pull the CC0 anime-offline-database (adds new/upcoming
#                        titles, refreshes facts; never touches community descriptions)
#  - db:import-anime-rankings → refresh anime score/popularity from Jikan top/anime
#  - db:import-manga   → refresh the manga catalog from Jikan top/manga
#  - db:link-adaptations → link each manga to its anime adaptation via Jikan
#                        relations (powers shared manga+anime communities)
#
# Requires a repository secret DATABASE_URL (Supabase session-pooler connection
# string). Trigger manually any time from the Actions tab ("Run workflow").

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch:

# don't let two syncs overlap
concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # link-adaptations makes one Jikan call per manga (rate-limited), so allow headroom
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Preflight — verify DATABASE_URL + DB connectivity
        run: node scripts/ci-db-check.cjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Full anime catalog (offline DB)
        run: npm run db:import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Anime rankings (Jikan top/anime)
        run: npm run db:import-anime-rankings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Manga catalog (Jikan top/manga)
        run: npm run db:import-manga
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Backfill English titles (AniList — fills missing only)
        run: npm run db:backfill-english
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Runs last, once both anime and manga are imported — it matches each
      # manga's adaptation to an anime by mal_id, so both must already exist.
      - name: Link manga ↔ anime adaptations (Jikan relations)
        run: npm run db:link-adaptations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
