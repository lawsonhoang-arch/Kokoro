<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Kokoro</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 32px; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #f1eae1;
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(228,139,83,0.10), transparent 60%),
        #17110e;
    }
    .mark { width: 76px; height: 76px; }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 6px 0 0; }
    p { color: #c3b4a8; font-size: 14.5px; line-height: 1.55; max-width: 42ch; margin: 0; }
    button {
      margin-top: 6px; padding: 11px 22px; border: 0; border-radius: 100px; cursor: pointer;
      font: inherit; font-weight: 700; font-size: 14px;
      color: #190f0a; background: #e48b53;
      box-shadow: 0 2px 16px rgba(228,139,83,0.35);
    }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
    <defs>
      <linearGradient id="h" x1="30%" y1="18%" x2="70%" y2="100%">
        <stop offset="0%" stop-color="#ffc590" /><stop offset="42%" stop-color="#e48b53" /><stop offset="100%" stop-color="#bd6531" />
      </linearGradient>
    </defs>
    <path fill="url(#h)" d="M256 452 C232 430 92 344 92 214 C92 158 134 120 186 120 C220 120 246 140 256 166 C266 140 292 120 326 120 C378 120 420 158 420 214 C420 344 280 430 256 452 Z" />
  </svg>
  <h1>You're offline</h1>
  <p>Kokoro needs a connection for your lists, journal, and the catalogue. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
